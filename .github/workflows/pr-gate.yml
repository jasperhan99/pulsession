name: PR gate

# Enforces the two pull-request rules in CONTRIBUTING.md so they do not have to
# be enforced by hand: a PR from outside the repo must reference an issue a
# maintainer has labelled `accepted`, and nobody keeps more than two open at
# once. A PR that breaks either is commented on and closed.
#
# `pull_request_target` so the token can comment and close on a fork's PR. That
# is safe here only because nothing from the PR is checked out or run: the
# script reads the PR's metadata through the API and nothing else. Keep it that
# way — adding a checkout of the PR's head to this workflow hands a fork's code
# a write token.
on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write
  issues: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const exempt = ['OWNER', 'MEMBER', 'COLLABORATOR'];
            if (exempt.includes(pr.author_association) || pr.user.type === 'Bot') return;

            const { owner, repo } = context.repo;
            const guide = `https://github.com/${owner}/${repo}/blob/main/CONTRIBUTING.md#pull-requests`;

            async function refuse(english, chinese) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: pr.number,
                body: `${english}\n\n${chinese}\n\n${guide}`,
              });
              await github.rest.pulls.update({ owner, repo, pull_number: pr.number, state: 'closed' });
              core.notice(`Closed #${pr.number}: ${english}`);
            }

            // At most two open at a time. This one counts, so a third is refused.
            const open = await github.paginate(github.rest.pulls.list, { owner, repo, state: 'open', per_page: 100 });
            const mine = open.filter(p => p.user.login === pr.user.login);
            if (mine.length > 2) {
              return refuse(
                'Closing automatically: you already have two pull requests open here. Please wait for those to be reviewed before opening another.',
                '自动关闭：你在这里已经有两个未处理的 PR 了，请等它们审完再开新的。'
              );
            }

            // Every `#N` in the description, checked for an issue labelled `accepted`.
            const numbers = [...new Set([...(pr.body || '').matchAll(/(?<![\w/])#(\d+)\b/g)].map(m => Number(m[1])))];
            for (const number of numbers) {
              try {
                const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number: number });
                if (!issue.pull_request && issue.labels.some(l => (l.name || l) === 'accepted')) return;
              } catch (error) {
                // A number that is not an issue here is simply not a link.
              }
            }
            return refuse(
              'Closing automatically: this pull request does not reference an issue labelled `accepted`. Please open an issue describing the problem first; once a maintainer accepts it, open a new PR with `Closes #<issue>` in the description.',
              '自动关闭：这个 PR 没有关联带 `accepted` 标签的 issue。请先开 issue 描述问题，维护者接受之后，再开新的 PR，并在描述里写上 `Closes #<issue>`。'
            );
